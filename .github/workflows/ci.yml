name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check (compile all modules)
        run: |
          python -m compileall -q src tests run_pipeline.py setup.py

      - name: Lint - fatal errors only
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint - full report (non-blocking)
        continue-on-error: true
        run: |
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Formatting check (non-blocking)
        continue-on-error: true
        run: |
          pip install black
          black --check --diff src/ tests/

      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: Pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train voltage model on real MP data
        run: python src/train_voltage.py --data data/processed/mp_voltage.csv --tag voltage

      - name: Train capacity model (multi-objective)
        run: python src/train_capacity.py

      - name: Train gap/ef models (from committed processed CSV)
        run: |
          test -f data/processed/expt_gap.csv
          test -f data/processed/perovskites_ef.csv
          python src/train_gap.py
          python src/train_ef.py

      - name: Probe matbench download URL (non-blocking)
        continue-on-error: true
        run: python src/download_data.py

      - name: Conformal calibration (voltage + capacity)
        run: |
          python src/conformal.py --tag voltage
          python src/conformal.py --tag capacity

      - name: Structure-aware formation energy (CPU baseline, smoke subset)
        run: python src/train_ef_struct.py --subset 4000 --skip-group

      - name: CGCNN CLI interface check (no torch needed)
        run: python src/train_cgcnn.py --help

      - name: External validation on known cathodes
        run: python src/validate_known_cathodes.py

      - name: External validation on MP Li materials
        run: python src/validate_mp_external.py

      - name: CLI prediction smoke test
        run: |
          python src/predictor.py --formulas "LiFePO4,LiCoO2" --json > pred.json
          python -c "import json; d=json.load(open('pred.json')); assert len(d)==2, d; v=[x['Voltage_ensemble_V'] for x in d]; assert v[0]!=v[1], ('不同化学式预测相同，疑似特征列错位', v); print('predictions:', v)"

      - name: Verify artifacts
        run: |
          test -f data/processed/mp_voltage.csv
          test -f data/processed/mp_summary_Li.csv.gz
          test -f results/metrics_voltage.json
          test -f results/parity_voltage.png
          test -f results/importance_voltage.png
          test -f results/metrics_capacity.json
          test -f results/parity_capacity.png
          test -f results/validation_known_cathodes.csv
          test -f results/validation_mp_external.json
          test -f results/conformal_voltage.json
          test -f results/conformal_capacity.json
          test -f results/calibration_voltage.png
          test -f results/metrics_ef_struct_smoke.json
          echo "Pipeline smoke test passed."

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            results/metrics_voltage.json
            results/parity_voltage.png
            results/importance_voltage.png
            results/metrics_capacity.json
            results/parity_capacity.png
            results/validation_known_cathodes.csv
            results/validation_mp_external.json
            results/conformal_voltage.json
            results/conformal_capacity.json
            results/calibration_voltage.png
            results/metrics_ef_struct_smoke.json
            results/parity_ef_struct_smoke.png
          if-no-files-found: ignore

  security:
    name: Security scan (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bandit
        run: |
          pip install bandit
          bandit -r src/ -f summary || true
